<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{background:#08090c;color:#e3e6ea;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{touch-action:manipulation;font-family:inherit;cursor:pointer;border:none;outline:none;color:inherit}

input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

#top{flex-shrink:0;background:rgba(12,13,18,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(38,166,154,.22);padding-top:env(safe-area-inset-top,0px)}
#ct{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

.tb{flex:1;padding:8px 0 6px;text-align:center;font-size:9px;font-weight:600;color:rgba(255,255,255,.32)}

.hr{display:flex;align-items:center;justify-content:space-between;padding:9px 14px 6px;gap:8px}
.ht{font-size:14px;font-weight:900;letter-spacing:.03em;background:linear-gradient(135deg,#ffffff,#4db6ac 60%,#00695c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{font-size:10px;color:rgba(255,255,255,.38);margin-top:1px}
.hb{padding:5px 11px;border-radius:8px;font-size:11px;font-weight:700;background:rgba(38,166,154,.08);border:1px solid rgba(38,166,154,.28);color:#80cbc4;white-space:nowrap}

.est{padding:2px 14px 10px}

.est-lb{font-size:10px;color:rgba(255,255,255,.35);font-weight:600}
.est-main{font-size:20px;font-weight:900}
.est-conf{font-size:11px;color:rgba(255,255,255,.4);margin-left:auto}
.bars{display:flex;flex-direction:column;gap:3px}

.bar-track{flex:1;height:14px;background:rgba(255,255,255,.05);border-radius:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:7px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.bar-pct{width:42px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.oe{display:flex;gap:6px;margin-top:7px}
.oe-c{flex:1;padding:5px 8px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);text-align:center;font-size:10px;color:rgba(255,255,255,.4)}

.est-note{font-size:9px;color:rgba(255,255,255,.32);margin-top:6px;line-height:1.45}

.warnbox{margin-top:7px;padding:7px 10px;border-radius:9px;background:rgba(255,167,38,.08);border:1px solid rgba(255,167,38,.25);font-size:10px;color:#ffcc80;line-height:1.5}
.qs{display:flex;gap:5px;flex-wrap:wrap;padding:7px 14px;background:rgba(8,9,13,.6);border-top:1px solid rgba(255,255,255,.04);font-size:10px}
.qc{background:rgba(255,255,255,.04);border-radius:7px;padding:3px 8px;border:1px solid rgba(255,255,255,.05)}
.ql{color:rgba(255,255,255,.32);margin-right:3px}.qv{color:#80cbc4;font-weight:700}

.pad{padding:11px 12px 24px}
.sec{margin-bottom:11px;border-radius:12px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);overflow:hidden}
.sec-h{padding:10px 12px;background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:space-between;user-select:none;gap:8px}
.sec-h .t{font-size:13px;font-weight:800;color:rgba(128,203,196,.9)}
.sec-h .ar{font-size:10px;color:rgba(255,255,255,.25)}
.sec-b{padding:8px 11px 12px}
.rowg{display:flex;gap:8px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
.rowg label{font-size:11px;color:rgba(255,255,255,.42);font-weight:600;white-space:nowrap}
.fin{flex:1;min-width:90px;height:38px;background:rgba(255,255,255,.05);border:1px solid rgba(38,166,154,.22);border-radius:10px;color:#b2dfdb;font-size:14px;padding:0 11px;outline:none}
.fin:focus{border-color:rgba(128,203,196,.6);background:rgba(255,255,255,.08)}
.gin{width:96px;height:42px;background:rgba(255,255,255,.05);border:1px solid rgba(38,166,154,.22);border-radius:11px;color:#80cbc4;font-size:18px;font-weight:800;text-align:center;outline:none;font-family:ui-monospace,monospace}
.sin{width:58px;height:34px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:8px;color:#b2dfdb;font-size:13px;text-align:center;outline:none;font-family:ui-monospace,monospace}
.btn{padding:9px 13px;border-radius:10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
.btn.pri{background:linear-gradient(135deg,#26a69a,#00695c);color:#fff;border-color:transparent}
.btn.dng{background:rgba(255,100,100,.08);border-color:rgba(255,100,100,.22);color:#ff8a80}

.ci{padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.03);display:flex;align-items:center;justify-content:space-between;gap:6px}

.ci-tag{font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:5px;color:#08090c;background:#4db6ac}
.ci-tag.off{background:rgba(255,255,255,.14);color:rgba(255,255,255,.5)}
.pair{padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.03)}

.pair-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pair-v{font-family:ui-monospace,monospace;font-size:20px;font-weight:800;color:#80cbc4;white-space:nowrap;text-align:right}

.pair-v small{display:block;font-size:10px;font-weight:700;color:rgba(255,255,255,.4);margin-top:-3px}

.pair-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pair-c{flex:1;min-width:140px;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:4px 5px}
.pair-l{flex:1;font-size:9px;color:rgba(255,255,255,.4);font-weight:700;line-height:1.15}
.cw{display:flex;align-items:center;gap:5px}

.cp{background:rgba(38,166,154,.1);border:1px solid rgba(38,166,154,.22);color:#80cbc4}
.cm:active,.cp:active{transform:scale(.85)}
.vl{min-width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#eef2f6;font-family:ui-monospace,monospace}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:8px 11px;border-radius:9px;font-size:12px;font-weight:700;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.62)}
.chip.s{border-color:#4db6ac;color:#4db6ac;background:rgba(77,182,172,.1)}
.chip:active{transform:scale(.95)}
.btbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
.btbl th{color:rgba(128,203,196,.75);padding:3px 2px;font-weight:700;font-size:10px}
.btbl td{padding:2px}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{background:rgba(38,166,154,.08);color:rgba(128,203,196,.85);padding:6px 8px;font-weight:700;text-align:center;position:sticky;top:0;z-index:2}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:top}
.tbl .gm{text-align:center;font-family:ui-monospace,monospace;font-weight:700;color:rgba(255,255,255,.5);white-space:nowrap}
.mt{text-align:center;color:rgba(255,255,255,.18);padding:34px;font-size:13px;line-height:1.6}
.note{font-size:10px;color:rgba(255,255,255,.34);line-height:1.6;margin-top:6px}
.note b{color:rgba(255,255,255,.55)}
.ta{width:100%;min-height:300px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px;color:#b2dfdb;font-size:11px;font-family:ui-monospace,monospace;white-space:pre-wrap;resize:vertical;outline:none}
.sel{height:38px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#b2dfdb;font-size:13px;padding:0 8px;outline:none}
</style>

<body>
<div id="W">
  <div id="top"><div id="hdr"></div><div class="est" id="est"></div><div class="qs" id="qs"></div></div>
  <div id="ct"></div>
  <div id="tabs"></div>
</div>
<script>
/* ============================================================================
   汎用 設定メモ（新台対応）
   ----------------------------------------------------------------------------
   ★設計の芯: 解析が出ていない新台初日でも**生データは必ず残る**ようにし、
     解析が出たら同じデータのまま設定推定に切り替わる、の2層構造。
       層1 記録 … 総G・各カウンタ・示唆。機種固有の知識ゼロで動く
       層2 推定 … 項目に「設定別の基準値」を入れたものだけ二項尤度で推定する
     基準値が1つも入っていなければ**推定は出さない**（出すと嘘になる）。
   ★数字を勝手に埋めない。基準値は必ず人が入れる（出典もメモ欄に残せる）。
   ============================================================================ */
var SETS=[1,2,3,4,5,6];
var SC={1:"#78909C",2:"#42A5F5",3:"#66BB6A",4:"#FFA726",5:"#EF5350",6:"#AB47BC"};
var SK="univ_memo_v1";

/* 新台でとりあえず押さえる項目のひな形。
   d="G"  … 分母は総ゲーム数（基準値は 1/x で入れる）
   d=他のキー … 分母はそのカウンタ（基準値は % で入れる）
   ⚠️ 基準値(b)は**空**。機種ごとに人が入れる。 */
var PRESETS=[
 {k:"at",   n:"AT初当たり",      d:"G",     u:"1/x", g:"当たり"},
 {k:"bonus",n:"ボーナス初当たり", d:"G",     u:"1/x", g:"当たり"},
 {k:"cz",   n:"CZ初当たり",      d:"G",     u:"1/x", g:"当たり"},
 {k:"czS",  n:"CZ成功",          d:"cz",    u:"%",   g:"当たり"},
 {k:"choku",n:"AT直撃",          d:"G",     u:"1/x", g:"当たり"},
 {k:"weak", n:"弱チェリー",      d:"G",     u:"1/x", g:"小役"},
 {k:"kyo",  n:"強チェリー",      d:"G",     u:"1/x", g:"小役"},
 {k:"suika",n:"スイカ",          d:"G",     u:"1/x", g:"小役"},
 {k:"chance",n:"チャンス目",     d:"G",     u:"1/x", g:"小役"},
 {k:"bell", n:"ベル",            d:"G",     u:"1/x", g:"小役"},
 {k:"grape",n:"ブドウ",          d:"G",     u:"1/x", g:"小役"},
 {k:"weakCZ",n:"弱チェ→CZ/AT当選",d:"weak", u:"%",   g:"レア役の当選"},
 {k:"kyoHit",n:"強チェ→直撃",    d:"kyo",   u:"%",   g:"レア役の当選"},
 {k:"suikaCZ",n:"スイカ→CZ/AT当選",d:"suika",u:"%",  g:"レア役の当選"}
];

/* 時系列ログのイベント種別。
   cnt … 追加したときに連動して+1するカウンタ（削除すると-1に戻す）
   res … 結果の選択肢。[0] を選ぶと cntOk のカウンタも+1（CZ成功など）
   free… 自由入力欄のプレースホルダ（アイキャッチ・終了画面・ボイス・メモ用）
   ⚠️ 機種ごとの選択肢は持たない（汎用ツールなので**自由入力**にする）。
      「終了画面A」「赤アイキャッチ」など、打ち手の言葉でそのまま残せる方が後で読める。 */
var TYPES=[
 {k:"cz",   l:"CZ",   ic:"🎰", cnt:"cz", res:["成功","失敗"], cntOk:"czS", free:"CZ名（任意）"},
 {k:"at",   l:"AT当選",ic:"🔥", cnt:"at", free:"契機（規定G / レア役 / CZ など）"},
 {k:"bonus",l:"ボーナス",ic:"🎁", cnt:"bonus", free:"種類（任意）"},
 {k:"ptz",  l:"ポイント加算ゾーン",ic:"📈", free:"ゾーン名・獲得pt（例: 100pt / 青7ゾーン）"},
 {k:"eye",  l:"アイキャッチ",ic:"👁", free:"色・種類（例: 赤 / キャラA）"},
 {k:"end",  l:"終了画面",ic:"🖼", free:"画面の種類（例: 画面A / 全員集合）"},
 {k:"voice",l:"ボイス",ic:"🔊", free:"セリフ・キャラ"},
 {k:"memo", l:"フリーメモ",ic:"📝", free:"自由に書く（ヤメ時・ざわつき・挙動など）"},
 /* 旧「示唆タブ」から移したものの受け皿。新規入力では選べない（一覧の表示用） */
 {k:"etc",  l:"示唆（旧データ）",ic:"💬", free:"", hidden:true}
];
var TYPEM={};TYPES.forEach(function(t){TYPEM[t.k]=t});

/* 示唆のタグ。conf=ハード制約（その設定以外を消す）/ soft=重み */
var SIGT=[
 {k:"ge2", l:"設定2以上",   m:[2,3,4,5,6]},
 {k:"ge3", l:"設定3以上",   m:[3,4,5,6]},
 {k:"ge4", l:"設定4以上",   m:[4,5,6]},
 {k:"ge5", l:"設定5以上",   m:[5,6]},
 {k:"s6",  l:"設定6確定",   m:[6]},
 {k:"odd", l:"奇数示唆",    w:{1:1.6,2:.7,3:1.6,4:.7,5:1.6,6:.7}},
 {k:"even",l:"偶数示唆",    w:{1:.7,2:1.6,3:.7,4:1.6,5:.7,6:1.6}},
 {k:"hi1", l:"高設定示唆(弱)",w:{1:.8,2:.9,3:1.0,4:1.15,5:1.25,6:1.35}},
 {k:"hi2", l:"高設定示唆(強)",w:{1:.5,2:.65,3:.85,4:1.3,5:1.6,6:1.9}},
 {k:"lo1", l:"低設定示唆",  w:{1:1.5,2:1.3,3:1.1,4:.8,5:.65,6:.5}},
 {k:"none",l:"示唆なし(デフォルト)",w:null}
];
var SIGM={};SIGT.forEach(function(s){SIGM[s.k]=s});

/* ------------------------------------------------------------------ 状態 */
var S=null, TAB="rec", OPEN={}, EDIT=null;
/* 履歴の入力中バッファ */
var lgT="at", lgG="", lgV="", lgR=null, lgS="none", lgN="";

function blankSession(){
 return {id:Date.now(), date:todayStr(), hall:"", mach:"", unit:"", memo:"",
         g:0, cnt:{}, items:JSON.parse(JSON.stringify(PRESETS)), sig:[], log:[], src:""};
}
function todayStr(){var d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function load(){
 try{var raw=localStorage.getItem(SK);
  if(raw){var d=JSON.parse(raw);
   if(d&&d.list&&d.list.length){ALL=d.list;CUR=d.cur||0;S=ALL[CUR]||ALL[0];normalize();return}}
 }catch(e){}
 ALL=[blankSession()];CUR=0;S=ALL[0];
}
function normalize(){
 if(!S.cnt)S.cnt={};
 if(!S.items||!S.items.length)S.items=JSON.parse(JSON.stringify(PRESETS));
 S.items.forEach(function(it){if(!(it.k in S.cnt))S.cnt[it.k]=0;if(!it.b)it.b=null});
 if(!S.sig)S.sig=[];
 if(!S.log)S.log=[];
 // ★ 旧版の「示唆タブ」で貯めた S.sig を履歴へ移す（示唆も時系列の1イベントとして扱う）。
 //   ⚠️ 二重に数えないよう、移したら S.sig は空にする。
 if(S.sig.length){
  S.sig.forEach(function(x){S.log.push({g:0,t:"etc",v:"",s:x.t,n:x.n||"",c:[],at:x.at||Date.now()})});
  S.sig=[];
 }
}
function save(){try{localStorage.setItem(SK,JSON.stringify({list:ALL,cur:CUR}))}catch(e){}}
var ALL=[],CUR=0;

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
 .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function itemOf(k){for(var i=0;i<S.items.length;i++)if(S.items[i].k===k)return S.items[i];return null}
function denomVal(it){return it.d==="G"?(parseInt(S.g)||0):(S.cnt[it.d]||0)}
function denomLabel(it){if(it.d==="G")return "総G";var o=itemOf(it.d);return o?o.n:it.d}
function hasBase(it){if(!it.b)return false;for(var i=0;i<SETS.length;i++){var v=it.b[SETS[i]];
 if(v===""||v===null||v===undefined||!isFinite(parseFloat(v)))return false}return true}

/* ------------------------------------------------------------- 推定エンジン */
function estimate(){
 var ll={},i,s,used=0,mask={},reasons=[],warn=[],confs=[];
 for(i=0;i<SETS.length;i++){ll[SETS[i]]=0;mask[SETS[i]]=true}
 // ① 基準値が入っている項目だけ二項尤度
 S.items.forEach(function(it){
  if(!hasBase(it))return;
  // ★ **数えていない項目は使わない**。0回を証拠にすると、0回はつねに
  //   「いちばん確率の低い設定」を支持するので推定が低設定へ系統的に偏る。
  //   実測（2026-10-11 の実機テスト・アオブタ版）: 3000G でボーナス 1/200（設定6相当）なのに、
  //   数えていない他項目の 0回 が効いて「設定2」と出た。
  if(!it.t)return;
  var n=S.cnt[it.k]||0, d=denomVal(it);
  if(!d)return;
  if(n>d){warn.push(it.n+" "+n+"回 > 分母("+denomLabel(it)+") "+d);return}
  used++;
  for(i=0;i<SETS.length;i++){s=SETS[i];
   var raw=parseFloat(it.b[s]);
   var p=(it.u==="1/x")?(raw>0?1/raw:0):(raw/100);
   p=Math.min(.999,Math.max(.00005,p));
   ll[s]+=n*Math.log(p)+(d-n)*Math.log(1-p);}
  reasons.push(it.n+" "+n+"/"+d+(it.u==="1/x"?(n?" (1/"+Math.round(d/n)+")":""):(d?" ("+(n/d*100).toFixed(1)+"%)":"")));
 });
 // ② 示唆（履歴の各イベントに付いたタグ）
 S.log.forEach(function(x){var t=SIGM[x.s];if(!t)return;
  if(t.m){var mm={};t.m.forEach(function(v){mm[v]=1});
   for(i=0;i<SETS.length;i++)if(!mm[SETS[i]])mask[SETS[i]]=false;
   confs.push(t.l);used++;}
  else if(t.w){used++;for(i=0;i<SETS.length;i++){s=SETS[i];ll[s]+=Math.log(t.w[s])}}
 });
 // ③ 矛盾した制約は解除（全滅させない）
 var any=false;for(i=0;i<SETS.length;i++)if(mask[SETS[i]])any=true;
 if(!any){for(i=0;i<SETS.length;i++)mask[SETS[i]]=true;warn.push("示唆どうしが矛盾しているので制約を解除しました")}
 var mx=-Infinity;for(i=0;i<SETS.length;i++)if(mask[SETS[i]]&&ll[SETS[i]]>mx)mx=ll[SETS[i]];
 var ex={},z=0;for(i=0;i<SETS.length;i++){s=SETS[i];var v=mask[s]?Math.exp(ll[s]-mx):0;ex[s]=v;z+=v}
 var post={};for(i=0;i<SETS.length;i++){s=SETS[i];post[s]=z?ex[s]/z:0}
 var best=1,bp=-1,esum=0,odd=0,even=0,hi=0;
 for(i=0;i<SETS.length;i++){s=SETS[i];if(post[s]>bp){bp=post[s];best=s}
  esum+=s*post[s];if(s%2)odd+=post[s];else even+=post[s];if(s>=4)hi+=post[s]}
 // 基準値が無い項目のうち、回数が入っているもの＝「記録はあるが判別に使えていない」
 var idle=[];S.items.forEach(function(it){
  if((S.cnt[it.k]||0)>0&&(!hasBase(it)||!it.t))idle.push(it.n+(hasBase(it)?"(未計測)":"(基準値なし)"))});
 return {post:post,best:best,bestP:bp,exp:esum,odd:odd,even:even,hi:hi,
         used:used,reasons:reasons,warn:warn,confs:confs,idle:idle};
}

 if(E.warn.length)h+='<div class="warnbox">⚠️ '+E.warn.map(esc).join("<br>⚠️ ")+'</div>';

   h+='</div>';}
  h+='</div>';});
 h+='<div class="sec"><div class="sec-b"><div class="rowg">'

function bump(k,d){S.cnt[k]=Math.max(0,(S.cnt[k]||0)+d);

   成立しただけの回は「成立（分母）」の＋だけを押す。 */
function bumpHit(dk,hk){S.cnt[hk]=(S.cnt[hk]||0)+1;S.cnt[dk]=(S.cnt[dk]||0)+1;
 var a=itemOf(hk),b=itemOf(dk);if(a)a.t=true;if(b)b.t=true;save();render()}

 var e={g:g,t:lgT,v:lgV.trim(),r:(t.res?lgR:null),s:(lgS==="none"?null:lgS),n:lgN.trim(),
        c:[],at:Date.now()};
 // ★ カウンタ連動。何を足したかを e.c に残し、削除時にそのぶんだけ戻す
 if(t.cnt){S.cnt[t.cnt]=(S.cnt[t.cnt]||0)+1;e.c.push(t.cnt);
  var it=itemOf(t.cnt);if(it)it.t=true;}
 if(t.res&&t.cntOk&&lgR===t.res[0]){S.cnt[t.cntOk]=(S.cnt[t.cntOk]||0)+1;e.c.push(t.cntOk);
  var it2=itemOf(t.cntOk);if(it2)it2.t=true;}
 S.log.push(e);
 // 総Gが遅れていたら追いつかせる（「〇Gで」を入れたのに総Gが古いと率が壊れる）
 if(g>(S.g||0))S.g=g;
 lgV="";lgN="";lgR=null;lgS="none";lgG=String(g);
 save();render();
}
function lgDel(at){
 var i=-1;for(var j=0;j<S.log.length;j++)if(S.log[j].at===at){i=j;break}
 if(i<0)return;
 var e=S.log[i];
 (e.c||[]).forEach(function(k){S.cnt[k]=Math.max(0,(S.cnt[k]||0)-1)});
 S.log.splice(i,1);save();render();
}

function rList(){
 var h='<div class="pad">';
 h+='<div class="sec"><div class="sec-h"><span class="t">この台の情報</span></div><div class="sec-b">';
 h+='<div class="rowg"><label>日付</label><input class="fin" value="'+esc(S.date)+'" oninput="setF(\'date\',this.value)"></div>';
 h+='<div class="rowg"><label>店</label><input class="fin" value="'+esc(S.hall)+'" oninput="setF(\'hall\',this.value)" placeholder="例: 123+N大阪本店"></div>';
 h+='<div class="rowg"><label>機種</label><input class="fin" value="'+esc(S.mach)+'" oninput="setF(\'mach\',this.value)" placeholder="例: L青春ブタ野郎"></div>';
 h+='<div class="rowg"><label>台番</label><input class="fin" value="'+esc(S.unit)+'" oninput="setF(\'unit\',this.value)" placeholder="例: 1234"></div>';
 h+='</div></div>';
 h+='<div class="sec"><div class="sec-h"><span class="t">保存した台 '+ALL.length+'件</span></div><div class="sec-b">';
 ALL.forEach(function(x,i){
  var E=null;try{var bk=S;S=x;normalize();E=estimate();S=bk}catch(e){S=ALL[CUR]}
  var lbl=(x.mach||"機種未設定")+" "+(x.unit?"#"+x.unit:"");
  h+='<div class="ci"><div class="ci-l"><div class="ci-n">'+(i===CUR?"▶ ":"")+esc(lbl)+'</div>'
   +'<div class="ci-s">'+esc(x.date)+' '+esc(x.hall||"")+' ／ '+(x.g||0).toLocaleString()+'G'
   +(E&&E.used?' ／ 推定 <b>設定'+E.best+'</b> '+(E.bestP*100).toFixed(0)+'%':' ／ 推定なし')+'</div></div>'
   +'<div class="cw"><button class="btn" onclick="pick('+i+')">開く</button>'
   +'<button class="btn dng" onclick="delS('+i+')">削除</button></div></div>';});
 h+='</div></div>';
 h+='<button class="btn pri" style="width:100%;padding:14px" onclick="newSession()">＋ 新しい台を記録する</button>';
 h+='</div>';
 document.getElementById("ct").innerHTML=h;
}
function setF(f,v){S[f]=v;save();rHdr()}
function pick(i){CUR=i;S=ALL[i];normalize();save();render()}
function delS(i){if(!confirm("この台の記録を削除します"))return;
 ALL.splice(i,1);if(!ALL.length)ALL=[blankSession()];
 CUR=Math.min(CUR,ALL.length-1);S=ALL[CUR];normalize();save();render()}
function newSession(){
 var prev=S;var s=blankSession();
 // ★ 同じ機種を続けて打つことが多いので、機種・店・項目定義（基準値ごと）は引き継ぐ。
 //   引き継がないのは「回数・総G・示唆・メモ」＝その台固有のもの。
 s.mach=prev.mach;s.hall=prev.hall;s.src=prev.src;
 s.items=JSON.parse(JSON.stringify(prev.items));
 s.items.forEach(function(it){s.cnt[it.k]=0});
 ALL.push(s);CUR=ALL.length-1;S=s;normalize();save();TAB="rec";render()}

/* ------------------------------------------------------------- 出力タブ */
function buildText(){
 var E=estimate(),L=[];
 L.push("■ "+(S.mach||"機種未設定")+"  "+S.date+"  "+(S.hall||"")+(S.unit?" #"+S.unit:""));
 L.push("総ゲーム数: "+(S.g||0));
 L.push("");
 L.push("[カウント]");
 S.items.forEach(function(it){
  // 画面と同じく「分母／当選」は1行にまとめる（4/13 の形）
  var kids=S.items.filter(function(x){return x.d===it.k});
  var n=S.cnt[it.k]||0,d=denomVal(it);
  if(kids.length){
   if(!n&&!kids.some(function(x){return S.cnt[x.k]}))return;
   kids.forEach(function(x){var hh=S.cnt[x.k]||0;
    L.push("  "+it.n+" → "+x.n.replace(/^└ ?/,"")+": "+hh+"/"+n
     +(n?(" = "+(hh/n*100).toFixed(1)+"%"):"")
     +(hasBase(x)&&x.t?"  [判別に使用]":"  [記録のみ]"));});
   if(it.d==="G"&&S.g&&n)L.push("    （"+it.n+" 自体: "+n+"/"+S.g+" = 1/"+Math.round(S.g/n)+"）");
   return;}
  if(it.d&&it.d!=="G")return;
  if(!n&&!hasBase(it))return;
  var r;
  if(it.d==="G")r=(d&&n)?("1/"+Math.round(d/n)):"—";
  else r=d?((n/d*100).toFixed(1)+"%"):"—";
  L.push("  "+it.n+": "+n+" / 分母"+denomLabel(it)+" "+d+" = "+r
   +(hasBase(it)&&it.t?"  [判別に使用]":"  [記録のみ]"));});
 if(S.log.length){L.push("");L.push("[履歴]（G順）");
  var rows=S.log.slice().sort(function(a,b){return (+a.g||0)-(+b.g||0)||a.at-b.at}),prev={};
  rows.forEach(function(e){var ty=TYPEM[e.t]||{l:e.t};
   var gap="";
   if(e.t==="at"||e.t==="cz"||e.t==="bonus"){
    gap=" [間隔+"+((+e.g||0)-(prev[e.t]||0))+"]";prev[e.t]=+e.g||0;}
   L.push("  "+String(+e.g||0).padStart(5)+"G"+gap+"  "+ty.l
    +(e.r?("・"+e.r):"")+(e.v?("  "+e.v):"")
    +(e.s&&SIGM[e.s]?("  <"+SIGM[e.s].l+">"):"")
    +(e.n?("  // "+e.n):""));});}
 L.push("");
 if(E.used){L.push("[推定] 設定"+E.best+"（確度 "+(E.bestP*100).toFixed(0)+"% / 期待値 "+E.exp.toFixed(2)+"）");
  L.push("  "+SETS.map(function(s){return "設定"+s+" "+(E.post[s]*100).toFixed(1)+"%"}).join(" / "));
  L.push("  高設定(4-6) "+(E.hi*100).toFixed(0)+"% / 奇数 "+(E.odd*100).toFixed(0)+"% / 偶数 "+(E.even*100).toFixed(0)+"%");
  if(E.reasons.length)L.push("  根拠: "+E.reasons.join(" / "));
  if(E.idle.length)L.push("  ※基準値が無く未使用: "+E.idle.join("、"));
 }else L.push("[推定] なし（基準値も示唆も入っていない）");
 if(S.src)L.push("  出典: "+S.src);
 if(S.memo){L.push("");L.push("[メモ]");L.push("  "+S.memo.replace(/\n/g,"\n  "))}
 return L.join("\n");
}
function rExp(){
 var h='<div class="pad">';
 h+='<div class="sec"><div class="sec-h"><span class="t">この台のまとめ（コピー用）</span></div><div class="sec-b">'
  +'<textarea class="ta" readonly>'+esc(buildText())+'</textarea></div></div>';
 h+='<div class="sec"><div class="sec-h"><span class="t">バックアップ / 復元（JSON）</span></div><div class="sec-b">'
  +'<div class="note" style="margin:0 0 7px">全台ぶんのデータです。別の端末へ移すときはこれを貼り付けて復元してください。</div>'
  +'<textarea class="ta" id="io" style="min-height:160px">'+esc(JSON.stringify({list:ALL,cur:CUR}))+'</textarea>'
  +'<div class="rowg" style="margin-top:8px"><button class="btn pri" onclick="doImport()">貼り付けた内容で復元</button>'
  +'<button class="btn dng" onclick="wipe()">全データ削除</button></div></div></div>';
 h+='</div>';
 document.getElementById("ct").innerHTML=h;
}
function doImport(){
 var t=document.getElementById("io").value;
 try{var d=JSON.parse(t);
  if(!d||!d.list||!d.list.length)throw new Error("list が無い");
  if(!confirm("現在の "+ALL.length+"件を、貼り付けた "+d.list.length+"件で置き換えます。よろしいですか？"))return;
  ALL=d.list;CUR=Math.min(d.cur||0,ALL.length-1);S=ALL[CUR];normalize();save();TAB="rec";render();
 }catch(e){alert("読み込めませんでした: "+e.message)}
}
function wipe(){if(!confirm("保存した全データを削除します。元に戻せません。"))return;
 try{localStorage.removeItem(SK)}catch(e){}
 ALL=[blankSession()];CUR=0;S=ALL[0];normalize();save();render()}

load();normalize();render();
</script>
